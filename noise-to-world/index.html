<!DOCTYPE html>

           background: radial-gradient(circle at center, rgba(6,7,12,.55), rgba(6,7,12,.96)); backdrop-filter: blur(6px); transition: opacity .6s; }

  #panel p { margin: 0 0 30px; letter-spacing: 6px; color: #9aa0b4; }

<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>从噪声到世界</h1>
  <p>AI 绘画与视频的进化史</p>
  <button id="play" disabled>加载中…</button>
  <button id="export" disabled>导出 MP4</button>
  <div id="status"></div>
  <div id="keys">空格 播放/暂停 · ← → 快退/快进 5 秒 · F 全屏 · Esc 回到面板</div>
</div>
<audio id="bgm" src="bgm.mp4" preload="auto"></audio>

<script>
// ============================================================
//  Vibe 知识大赏 · 引擎模板
//  所有画面都是 render(t) 的纯函数：播放时 t = audio.currentTime，导出时逐帧步进。
//  逻辑坐标恒为 1920×1080；预览按 1x 画，导出按 EXPORT_SCALE 倍超采样（2 = 4K）。
// ============================================================
const CONFIG = {
  title: '从噪声到世界',          // 中文片名（片尾 / 面板）
  titleEn: 'From Noise to World',     // 英文片名（片尾高级感）
  tagline: 'Every image begins as static.',      // 片尾英文斜体一句话（科普类结尾用）
  dur: 130,                     // 视频总长（秒），按 BGM 有效长度设
  exportFps: 60,               // 抖音上限 60
  exportScale: 2,              // 2 → 3840×2160（4K）
  ending: 'title',            // 'choice'（情感类：二选一） | 'title'（科普类：片名 + 英文）
};
const W = 1920, H = 1080, DUR = CONFIG.dur;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SS = 1; // 当前超采样倍数
function setScale(s) { SS = s; canvas.width = W * s; canvas.height = H * s; }
setScale(1);

const SANS = '"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
const SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif';
const EN = '"Cormorant Garamond","Times New Roman",serif';
const COL = {
  gold: [255, 207, 110], rose: [255, 93, 122], ice: [127, 179, 255],
  slate: [74, 82, 104], text: [243, 236, 223], dim: [138, 143, 163], white: [255, 255, 255],
};
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---------- 数学 ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out3: x => 1 - Math.pow(1 - x, 3), in3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
};
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // 确定性随机：同一帧永远一样
const win = (t, a, b, fi = .35, fo = .35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));

// ---------- 音频包络：画面随音乐呼吸 ----------
let AB = null, ENV = new Float32Array(1), KICK = new Float32Array(1);
const ENV_HZ = 100;
function buildEnvelope(ab) {
  const d = ab.getChannelData(0), hop = Math.floor(ab.sampleRate / ENV_HZ), n = Math.floor(d.length / hop), e = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < hop; j++) s += Math.abs(d[i * hop + j]); e[i] = s / hop; }
  const p98 = Array.from(e).sort((a, b) => a - b)[Math.floor(n * .98)] || 1;
  ENV = new Float32Array(n); KICK = new Float32Array(n);
  const flux = new Float32Array(n); let sm = 0;
  for (let i = 0; i < n; i++) { sm = sm * .9 + (e[i] / p98) * .1; ENV[i] = clamp(sm); flux[i] = Math.max(0, e[i] - (e[i - 2] || 0)); }
  const fmax = Array.from(flux).sort((a, b) => a - b)[Math.floor(n * .995)] || 1;
  let k = 0; for (let i = 0; i < n; i++) { k = Math.max(clamp(flux[i] / fmax), k * .9); KICK[i] = k; }
}
const env = t => ENV[clamp(Math.floor(t * ENV_HZ), 0, ENV.length - 1)] || 0;
const kick = t => KICK[clamp(Math.floor(t * ENV_HZ), 0, KICK.length - 1)] || 0;

// ---------- 绘图工具 ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + .9 * s);
  ctx.bezierCurveTo(x - 1.6 * s, y - .1 * s, x - .9 * s, y - 1.25 * s, x, y - .45 * s);
  ctx.bezierCurveTo(x + .9 * s, y - 1.25 * s, x + 1.6 * s, y - .1 * s, x, y + .9 * s); ctx.closePath();
}
function glowText(txt, x, y, font, color, glow = 0, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow * SS; }
  ctx.fillStyle = color; ctx.fillText(txt, x, y); ctx.restore();
}
// 逐字距排版（英文大写 + 宽字距 = 高级感）
function spacedText(txt, x, y, font, color, spacing, alpha = 1, glow = 0) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow * SS; }
  const chars = [...txt], ws = chars.map(c => ctx.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let cx = x - tw / 2; chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + spacing; }); ctx.restore();
}
function ring(x, y, t, t0, dur, r0, r1, c, w = 4) {
  const p = seg(t, t0, t0 + dur); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = rgba(c, (1 - p) * .8); ctx.lineWidth = w * (1 - p) + .5;
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, E.out3(p)), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function burst(x, y, t, t0, n, seed, cols, spd = 420, life = 1.3) {
  const p = (t - t0) / life; if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = hash(seed + i) * Math.PI * 2, v = spd * (.35 + hash(seed + i * 7.3) * .9), d = v * E.out3(p) * life * .8;
    ctx.fillStyle = rgba(cols[i % cols.length], (1 - p) * .9); ctx.beginPath();
    ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d + 120 * p * p, (2 + hash(seed + i * 3.1) * 5) * (1 - p * .6), 0, 7); ctx.fill();
  }
  ctx.restore();
}
function flash(alpha, c = [255, 240, 210]) { if (alpha <= 0) return; ctx.fillStyle = rgba(c, alpha); ctx.fillRect(0, 0, W, H); }
// 推镜：以 (fx,fy) 为焦点放大 s 倍，centerP 把焦点同时拉到画面中央。转场 = 推进到细节 → 细节铺满 → 下一场从同色/同形展开
function zoomTo(fx, fy, s, centerP) { ctx.translate(lerp(fx, W / 2, centerP), lerp(fy, H / 2, centerP)); ctx.scale(s, s); ctx.translate(-fx, -fy); }

// ---------- 背景 / 暗角 / 胶片颗粒 ----------
const vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
{ const g = vignette.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.72)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const grainTiles = [];
for (let k = 0; k < 4; k++) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .37 + k * 91.7) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 20; }
  g.putImageData(im, 0, 0); grainTiles.push(c);
}
const STARS = Array.from({ length: 160 }, (_, i) => ({ x: hash(i) * W, y: hash(i + 500) * H, r: .6 + hash(i + 900) * 1.8, s: .2 + hash(i + 1300) }));
// 每段的背景色调：[时间, 主色, 副色]，段与段之间自动渐变
const TINTS = [
  [0, [90, 130, 220], [255, 93, 122]],
  [17, [255, 93, 122], [60, 110, 220]],
  [33, [255, 160, 80], [120, 80, 200]],
  [48, [60, 110, 220], [255, 207, 110]],
  [78, [40, 50, 90], [90, 70, 120]],
  [93.5, [120, 200, 255], [255, 93, 122]],
  [112, [255, 207, 110], [90, 110, 200]],
  [122, [255, 207, 110], [255, 93, 122]],
];
function tintAt(t) {
  for (let i = 0; i < TINTS.length - 1; i++) if (t < TINTS[i + 1][0]) {
    const p = E.io3(seg(t, TINTS[i][0], Math.min(TINTS[i + 1][0], TINTS[i][0] + 1.5)));
    const prev = i > 0 ? TINTS[i - 1] : TINTS[i];
    return [mix(prev[1], TINTS[i][1], p), mix(prev[2], TINTS[i][2], p)];
  }
  const l = TINTS[TINTS.length - 1]; return [l[1], l[2]];
}
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0c14'); g.addColorStop(1, '#05060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [c1, c2] = tintAt(t), e = env(t), k = kick(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [c, bx, by, br, ph] of [[c1, .22, .3, 900, 0], [c2, .8, .7, 950, 2.1], [c1, .6, .1, 700, 4.2]]) {
    const x = W * bx + Math.sin(t * .13 + ph) * 160, y = H * by + Math.cos(t * .11 + ph) * 120;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, br * (1 + k * .06));
    gr.addColorStop(0, rgba(c, .085 + e * .05 + k * .03)); gr.addColorStop(1, rgba(c, 0)); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  for (const s of STARS) {
    ctx.fillStyle = `rgba(255,240,220,${(.12 + .25 * s.s) * (.7 + .3 * Math.sin(t * 2 + s.x))})`;
    ctx.beginPath(); ctx.arc(s.x, (s.y - t * 8 * s.s + H * 10) % H, s.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawPost(t) {
  ctx.drawImage(vignette, 0, 0, W, H);
  const f = Math.floor(t * 24), ox = (hash(f) * 256) | 0, oy = (hash(f + 3) * 256) | 0, tile = grainTiles[f % 4];
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) ctx.drawImage(tile, x, y);
}

// ============================================================
//  字幕：逐字浮现，{金色高亮} [玫红高亮]，\n 换行
// ============================================================
const CAPS = [
  [0.4, 3.8, '你最近刷到的那些 {AI 图}'],
  [3.9, 7.7, '诞生之前，都长这样：\n一屏[雪花]'],
  [7.9, 11.5, 'AI 只做了一件事：\n一点点{擦掉噪声}'],
  [11.6, 15.3, '它是怎么学会的？'],
  [17.4, 20.8, '2014 年，一个想法在{酒吧}里诞生'],
  [21.0, 24.4, '让两个 AI 互相较劲\n一个[造假]，一个鉴定'],
  [24.5, 28.5, '造假的越来越像，鉴定的越来越难'],
  [28.6, 32.4, '2018 年，它画出的人脸\n已经{以假乱真}'],
  [33.1, 36.5, '2020 年，研究者换了个思路'],
  [36.6, 40.4, '先把一张图，一步步[毁掉]'],
  [40.5, 44.0, '再让 AI 学会：每一步\n猜出加了什么{噪声}'],
  [44.1, 47.4, '倒着走 {1000} 步——\n雪花变回了画'],
  [48.1, 51.7, '可它画什么，你说了[不算]'],
  [51.8, 55.6, '2021 年，CLIP 读了 {4 亿} 对图文'],
  [55.7, 59.6, '从此，{一句话}就能变成画'],
  [59.7, 63.7, '文字给方向，去噪给细节'],
  [63.8, 67.7, '2022 年，AI 绘画[井喷]'],
  [67.8, 71.9, '压进潜空间\n{家用显卡}也能跑'],
  [72.0, 77.4, '一幅 AI 画作\n拿下了美术比赛{一等奖}'],
  [78.6, 82.6, '但掌声背后，也有[质疑]'],
  [82.7, 88.0, '它学会的每一笔\n都来自人类的画'],
  [88.1, 93.2, 'AI 擦掉了噪声\n也擦掉了[谁的名字]？'],
  [93.7, 98.5, '2024 年，Sora 让画面{动了起来}'],
  [98.6, 102.9, '把视频切成「时空补丁」\n一起去噪'],
  [103.0, 107.4, '一年之内，视频有了物理\n有了{声音}'],
  [107.5, 111.9, '下一步：生成一个\n[能走进去]的世界'],
  [112.4, 116.5, '从一屏雪花，到一个世界\n只用了 {10 年}'],
  [116.6, 121.6, '下一张让你心动的图\n[你还分得清是谁画的吗？]'],
].map(([a, b, s]) => ({ a, b, lines: parseCap(s) }));
function parseCap(s) {
  const lines = [[]]; let hl = 0;
  for (const ch of s) {
    if (ch === '{') { hl = 1; continue; } if (ch === '}' || ch === ']') { hl = 0; continue; }
    if (ch === '[') { hl = 2; continue; } if (ch === '\n') { lines.push([]); continue; }
    lines[lines.length - 1].push({ ch, hl });
  }
  return lines;
}
const CAP_Y = 975, CAP_FS = 54, CAP_MAXW = 1500;
function drawCaptions(t) {
  for (const c of CAPS) {
    if (t < c.a || t > c.b) continue;
    const vis = win(t, c.a, c.b, .3, .25);
    ctx.save();
    const gr = ctx.createRadialGradient(W / 2, CAP_Y + 30, 0, W / 2, CAP_Y + 30, 620);
    gr.addColorStop(0, `rgba(5,6,10,${.6 * vis})`); gr.addColorStop(1, 'rgba(5,6,10,0)'); ctx.fillStyle = gr; ctx.fillRect(0, CAP_Y - 300, W, 420);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = `700 ${CAP_FS}px ${SANS}`;
    let maxw = 0; for (const ln of c.lines) maxw = Math.max(maxw, ln.reduce((s, o) => s + ctx.measureText(o.ch).width, 0));
    const fs = Math.min(CAP_FS, CAP_FS * CAP_MAXW / maxw), lh = fs * 1.5; ctx.font = `700 ${fs}px ${SANS}`;
    const y0 = CAP_Y - (c.lines.length - 1) * lh / 2, exit = seg(t, c.b - .25, c.b), k = kick(t);
    let idx = 0;
    c.lines.forEach((ln, li) => {
      const ws = ln.map(o => ctx.measureText(o.ch).width); let x = W / 2 - ws.reduce((a, b) => a + b, 0) / 2;
      ln.forEach((o, i) => {
        const tc = c.a + idx * .028, p = E.out3(seg(t, tc, tc + .4)); idx++;
        const a = p * (1 - exit);
        if (a > 0) {
          ctx.globalAlpha = a;
          if (o.hl) { const cc = o.hl === 1 ? COL.gold : COL.rose; ctx.shadowColor = rgba(cc, .9); ctx.shadowBlur = (18 + 22 * k) * SS; ctx.fillStyle = rgba(cc); }
          else { ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12 * SS; ctx.fillStyle = rgba(COL.text); }
          ctx.fillText(o.ch, x, y0 + li * lh + (1 - p) * 28 - exit * 16);
        }
        x += ws[i];
      });
    });
    ctx.restore();
  }
}
// 章节小标签（左上角，可选）。注意：不要做顶部进度条 / 常驻片名，会破坏观感
const LABELS = [
  [17.2, 32.6, '01', 'GAN · 两个 AI 的对决'], [33.0, 47.4, '02', 'Diffusion · 反过来想'],
  [47.9, 77.4, '03', 'CLIP · 听懂人话'], [78.4, 93.2, '04', '另一面'], [93.7, 111.6, '05', 'Sora · 画面动起来'],
];
function drawLabels(t) {
  for (const [s, e, num, title] of LABELS) {
    const v = win(t, s, e, .5, .4); if (v <= 0) continue;
    ctx.save(); ctx.globalAlpha = v; const dx = (1 - E.out3(seg(t, s, s + .6))) * -40;
    glowText(num, 70 + dx, 70, `900 40px ${SANS}`, rgba(COL.gold), 16, 'left');
    ctx.fillStyle = rgba(COL.gold, .6); ctx.fillRect(130 + dx, 68, 60 * E.out3(seg(t, s + .1, s + .7)), 2);
    glowText(title, 208 + dx, 70, `700 36px ${SANS}`, rgba(COL.text, .9), 0, 'left');
    ctx.restore();
  }
}

// ============================================================
//  画作系统：程序化绘制 → 下采样成 96×54 像素网格（4 级分辨率，去噪时由粗到细）
// ============================================================
const GW = 96, GH = 54, NC = GW * GH;
const LVSZ = [[96, 54], [48, 27], [24, 14], [12, 7]];
function makePainting(draw) {
  const big = document.createElement('canvas'); big.width = 960; big.height = 540;
  const g = big.getContext('2d'); draw(g, 960, 540);
  const levels = []; let src = big;
  for (const [w, h] of LVSZ) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const cg = c.getContext('2d');
    cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = 'high'; cg.drawImage(src, 0, 0, w, h); src = c;
    const d = cg.getImageData(0, 0, w, h).data, arr = new Float32Array(NC * 3);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const si = Math.min(w - 1, Math.floor(i * w / GW)), sj = Math.min(h - 1, Math.floor(j * h / GH)), k = (sj * w + si) * 4, o = (j * GW + i) * 3;
      arr[o] = d[k]; arr[o + 1] = d[k + 1]; arr[o + 2] = d[k + 2];
    }
    levels.push(arr);
  }
  levels.big = big;
  return levels;
}
function paintSunset(g, w, h, sunY = 300, phase = 0, bird = null) {
  const hz = 330;
  let gr = g.createLinearGradient(0, 0, 0, hz);

const bgm = document.getElementById('bgm'), panel = document.getElementById('panel');
const playBtn = document.getElementById('play'), expBtn = document.getElementById('export'), statusEl = document.getElementById('status');
const qs = new URLSearchParams(location.search);
let manualT = parseFloat(qs.get('t') || '0'), exporting = false;
function loop() {
  if (!exporting) {
    const t = bgm.paused ? manualT : bgm.currentTime;
    if (!bgm.paused && t >= DUR) { bgm.pause(); manualT = DUR; panel.classList.remove('hide'); }
    if (!bgm.paused) bgm.volume = 1 - seg(t, DUR - 2, DUR) * .9;
    render(Math.min(t, DUR));
  }
  requestAnimationFrame(loop);
}
function play() { bgm.currentTime = manualT; bgm.play(); panel.classList.add('hide'); }
playBtn.onclick = () => { if (manualT >= DUR - .5) manualT = 0; play(); };
document.addEventListener('keydown', e => {
  if (exporting) return;
  if (e.code === 'Space') { e.preventDefault(); if (bgm.paused) play(); else { bgm.pause(); manualT = bgm.currentTime; } }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    const d = e.code === 'ArrowRight' ? 5 : -5;
    if (bgm.paused) manualT = clamp(manualT + d, 0, DUR); else bgm.currentTime = clamp(bgm.currentTime + d, 0, DUR);
  }
  else if (e.code === 'KeyF') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.code === 'Escape') { bgm.pause(); manualT = bgm.currentTime; panel.classList.remove('hide'); }
});

  }
  return null;
}

  exporting = true; bgm.pause(); playBtn.disabled = expBtn.disabled = true; setScale(scale);
  try {
    const sr = AB.sampleRate, ch = Math.min(2, AB.numberOfChannels);
    let acodec = 'aac', acfg = { codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 };
    if (!(await AudioEncoder.isConfigSupported(acfg)).supported) { acodec = 'opus'; acfg = { codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 }; }
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', firstTimestampBehavior: 'offset',
      video: { codec: vc.mux, width: vw, height: vh, frameRate: fps }, audio: { codec: acodec, numberOfChannels: ch, sampleRate: sr } });
    let encErr = null;
    const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { encErr = e; } }); ve.configure(vc.cfg);
    const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { encErr = e; } }); ae.configure(acfg);
    const totalS = Math.floor(dur * sr), CHUNK = 4096, chans = [...Array(ch)].map((_, c) => AB.getChannelData(c));
    let aOff = 0;
    const pushAudioUntil = sec => {
      const until = Math.min(totalS, Math.floor(sec * sr));
      while (aOff < until) {
        const n = Math.min(CHUNK, totalS - aOff), data = new Float32Array(n * ch);
        for (let c = 0; c < ch; c++) for (let i = 0; i < n; i++) data[c * n + i] = chans[c][aOff + i] * (1 - seg((aOff + i) / sr, dur - 2, dur) * .95);
        ae.encode(new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(aOff / sr * 1e6), data }));
        aOff += n;
      }
    };
    const frames = Math.round(dur * fps), t0 = performance.now();
    for (let i = 0; i < frames; i++) {
      if (encErr) throw encErr;
      const t = i / fps; render(t); pushAudioUntil(t + 1);
      const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      ve.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
      if (ve.encodeQueueSize > 4) await new Promise(r => ve.addEventListener('dequeue', r, { once: true }));
      if (i % 20 === 0) {
        const el = (performance.now() - t0) / 1000;
        statusEl.textContent = `导出中 ${(i / frames * 100).toFixed(1)}% · 剩余约 ${Math.ceil(el / (i + 1) * (frames - i - 1))} 秒（保持此标签页在前台）`;
        await new Promise(r => setTimeout(r, 0));
      }
    }
    pushAudioUntil(dur + 1);
    await ve.flush(); await ae.flush(); muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${CONFIG.title}_${vw}x${vh}_${fps}fps.mp4`; a.click();
    statusEl.textContent = `导出完成：${(blob.size / 1048576).toFixed(1)} MB · ${vc.cfg.codec} + ${acodec.toUpperCase()}`;
  } finally {
    setScale(1); exporting = false; playBtn.disabled = expBtn.disabled = false;
  }
}
const exportClick = () => exportMP4(parseInt(qs.get('fps') || CONFIG.exportFps), parseFloat(qs.get('scale') || CONFIG.exportScale))
  .catch(e => { statusEl.textContent = '导出失败：' + e.message; });

// ============================================================
//  启动：等字体 + 解码音频（file:// 打开时退化为手动选择 bgm）
// ============================================================
(async () => {
  const allText = CAPS.map(c => c.lines.flat().map(o => o.ch).join('')).join('') + LABELS.map(l => l[3]).join('') +
    CONFIG.title + '造假者鉴定师真假加噪去噪猜出噪声宇航员在月球上看地球升起生成开源压缩倍编码科罗拉多州博览会数字艺术类时空补丁可灵原生音频可交互的世界模型猫日落海浪城市森林星空花人画的·→←✦εstep=×0123456789%#AI美女二次元赛博朋克奇幻城堡太空猫落日月球漫步万♥.';
  initPaintings();
  statusEl.textContent = '加载字体与音乐…';
  const fontLoads = ['900 40px "Noto Sans SC"', '700 40px "Noto Sans SC"', '400 40px "Noto Sans SC"', '900 40px "Noto Serif SC"', '500 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"']
    .map(f => document.fonts.load(f, allText + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'));
  await Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 6000))]);
  const expLabel = `导出 MP4（${W * CONFIG.exportScale}×${H * CONFIG.exportScale} · ${CONFIG.exportFps}fps）`;
  const useAudio = async buf => {
    AB = await new AudioContext({ sampleRate: 48000 }).decodeAudioData(buf); buildEnvelope(AB);
    expBtn.disabled = false; expBtn.textContent = expLabel; expBtn.onclick = exportClick;
  };
  try { await useAudio(await (await fetch('bgm.mp4')).arrayBuffer()); statusEl.textContent = ''; }
  catch (e) {
    const pick = document.createElement('input'); pick.type = 'file'; pick.accept = 'audio/*,video/mp4';
    pick.onchange = async () => {
      const f = pick.files[0]; if (!f) return; statusEl.textContent = '解析音频…';
      try { await useAudio(await f.arrayBuffer()); statusEl.textContent = '音频已就绪，可以导出了'; } catch (err) { statusEl.textContent = '音频解析失败：' + err.message; }
    };
    expBtn.disabled = false; expBtn.textContent = '选择 bgm.mp4 以启用导出'; expBtn.onclick = () => pick.click();
    statusEl.textContent = '你是双击打开的，浏览器不允许自动读取音乐。点上面按钮选一下同目录的 bgm.mp4，或双击 start.bat';
  }
  playBtn.disabled = false; playBtn.textContent = '▶  播放';
  if (qs.has('hide')) panel.classList.add('hide');
  loop();
})();

// ---------- 调试：逐帧检查（控制台调用 sheet([1, 5, 9, 13]) 生成 2×2 帧拼图） ----------
window.sheet = times => {
  exporting = true; let s = document.getElementById('sheet');
  if (!s) { s = document.createElement('canvas'); s.id = 'sheet'; s.style.cssText = 'position:fixed;inset:0;z-index:99;width:100vw;height:100vh;object-fit:contain;background:#222'; document.body.appendChild(s); }
  s.width = W; s.height = H; const g = s.getContext('2d'); g.fillStyle = '#222'; g.fillRect(0, 0, W, H);
  times.forEach((t, i) => { render(t); g.drawImage(canvas, (i % 2) * 960, Math.floor(i / 2) * 540, 956, 536); g.fillStyle = '#0f0'; g.font = 'bold 28px sans-serif'; g.fillText(t.toFixed(2), (i % 2) * 960 + 10, Math.floor(i / 2) * 540 + 34); });
  return s;
};
// 把拼图发到 frame_sink.py（http://127.0.0.1:8799）存成 jpg，方便在终端里用 Read 查看
window.dump = async (name, times) => (await fetch('http://127.0.0.1:8799/' + name, { method: 'POST', body: sheet(times).toDataURL('image/jpeg', .85) })).text();
</script>
