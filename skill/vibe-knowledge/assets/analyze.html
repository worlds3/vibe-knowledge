<!doctype html>
<meta charset="utf-8">
<title>BGM 分析</title>
<body style="background:#111;color:#ddd;font:14px/1.6 monospace;padding:20px">
<pre id="o">分析 bgm.mp4 中…</pre>
<script>
// 把 bgm.mp4 放在同目录，用本地服务器打开本页；结果也挂在 window.R 上，方便自动化读取
(async () => {
  const ab = await new AudioContext({ sampleRate: 48000 }).decodeAudioData(await (await fetch('bgm.mp4')).arrayBuffer());
  const d = ab.getChannelData(0), sr = ab.sampleRate, h = Math.floor(sr * .01);
  const e = []; for (let i = 0; i + h < d.length; i += h) { let s = 0; for (let j = 0; j < h; j++) s += Math.abs(d[i + j]); e.push(s / h); }
  // 每秒能量
  const per = []; for (let i = 0; i < e.length; i += 100) { let m = 0, n = 0; for (let j = i; j < i + 100 && j < e.length; j++) { m += e[j]; n++; } per.push(m / n); }
  const peak = Math.max(...per), perN = per.map(v => +(v / peak).toFixed(2));
  // 有效结尾：最后一个能量 > 10% 的秒
  let end = perN.length; while (end > 0 && perN[end - 1] < .1) end--;
  // 速度：onset flux 自相关
  const flux = e.map((v, i) => Math.max(0, v - (e[i - 1] || 0)));
  let best = 0, bl = 50; for (let lag = 33; lag <= 100; lag++) { let s = 0; for (let i = 1000; i < Math.min(flux.length, 9000); i++) s += flux[i] * flux[i - lag]; if (s > best) { best = s; bl = lag; } }
  // 段落边界：0.25s 分辨率下，前后 2 秒平均能量突变 > 35%
  const q = []; for (let i = 0; i < e.length; i += 25) { let m = 0; for (let j = i; j < i + 25 && j < e.length; j++) m += e[j]; q.push(m / 25); }
  const avg = (a, b) => { let m = 0, n = 0; for (let i = Math.max(0, a); i < Math.min(q.length, b); i++) { m += q[i]; n++; } return n ? m / n : 0; };
  const cand = [];
  for (let i = 8; i < q.length - 8; i++) { const before = avg(i - 8, i), after = avg(i, i + 8), r = (after - before) / Math.max(before, after, 1e-6); if (Math.abs(r) > .35) cand.push([i * .25, r]); }
  const sections = []; for (const [tt, r] of cand) { const last = sections[sections.length - 1]; if (!last || tt - last.t > 3) sections.push({ t: tt, kind: r > 0 ? '爆发 / 进入' : '回落 / 安静', r: +r.toFixed(2) }); else if (Math.abs(r) > Math.abs(last.r)) Object.assign(last, { t: tt, kind: r > 0 ? '爆发 / 进入' : '回落 / 安静', r: +r.toFixed(2) }); }
  window.R = { duration: +ab.duration.toFixed(2), musicEnd: end, bpm: +(6000 / bl).toFixed(1), beat: +(bl / 100).toFixed(3), sections, energyPerSecond: perN };
  document.getElementById('o').textContent = JSON.stringify(window.R, null, 1);
})().catch(err => { document.getElementById('o').textContent = '失败：' + err.message + '\n需要用本地服务器打开（file:// 下浏览器禁止读取音频）'; });
</script>
