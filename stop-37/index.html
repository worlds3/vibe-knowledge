<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #f3ecdf; }

           background: radial-gradient(circle at center, rgba(6,7,12,.55), rgba(6,7,12,.96)); backdrop-filter: blur(6px); transition: opacity .6s; }

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="panel">
  <h1>何时该停下</h1>
  <p>最优停止理论 · 37% 法则</p>

  <button id="export" disabled>导出 MP4（1920×1080 · 120fps）</button>

</div>
<audio id="bgm" src="bgm.mp4" preload="auto"></audio>

<script>
// ============================================================
//  何时该停下 —— 最优停止 / 37% 法则
//  所有画面都是 render(t) 的纯函数：播放时 t 跟随音频，导出时逐帧步进
// ============================================================
const W = 1920, H = 1080, DUR = 130;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SANS = '"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
const SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif';
const COL = {
  gold: [255, 207, 110], rose: [255, 93, 122], ice: [127, 179, 255],
  slate: [74, 82, 104], text: [243, 236, 223], dim: [138, 143, 163], white: [255, 255, 255],
};
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---------- 数学小工具 ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out3: x => 1 - Math.pow(1 - x, 3),
  in3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
};
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
// 在 [a,b] 区间内可见，带淡入淡出
const win = (t, a, b, fi = .35, fo = .35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));

// ---------- 音频能量包络（让画面随音乐呼吸）----------
let AB = null, ENV = new Float32Array(1), KICK = new Float32Array(1);
const ENV_HZ = 100;
function buildEnvelope(ab) {
  const d = ab.getChannelData(0), sr = ab.sampleRate, hop = Math.floor(sr / ENV_HZ);
  const n = Math.floor(d.length / hop), e = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < hop; j++) s += Math.abs(d[i * hop + j]); e[i] = s / hop; }
  const sorted = Array.from(e).sort((a, b) => a - b), p98 = sorted[Math.floor(n * .98)] || 1;
  ENV = new Float32Array(n); KICK = new Float32Array(n);
  let sm = 0, fluxMax = 1e-6; const flux = new Float32Array(n);
  for (let i = 0; i < n; i++) { sm = sm * .9 + (e[i] / p98) * .1; ENV[i] = clamp(sm); flux[i] = Math.max(0, e[i] - (e[i - 2] || 0)); }
  const fs = Array.from(flux).sort((a, b) => a - b); fluxMax = fs[Math.floor(n * .995)] || 1;
  let k = 0; for (let i = 0; i < n; i++) { k = Math.max(clamp(flux[i] / fluxMax), k * .9); KICK[i] = k; }
}
const env = t => ENV[clamp(Math.floor(t * ENV_HZ), 0, ENV.length - 1)] || 0;
const kick = t => KICK[clamp(Math.floor(t * ENV_HZ), 0, KICK.length - 1)] || 0;

// ---------- 绘图小工具 ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + .9 * s);
  ctx.bezierCurveTo(x - 1.6 * s, y - .1 * s, x - .9 * s, y - 1.25 * s, x, y - .45 * s);
  ctx.bezierCurveTo(x + .9 * s, y - 1.25 * s, x + 1.6 * s, y - .1 * s, x, y + .9 * s); ctx.closePath();
}
function glowText(txt, x, y, font, color, glow = 0, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow > 0) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color; ctx.fillText(txt, x, y); ctx.restore();
}
function ring(x, y, t, t0, dur, r0, r1, c, w = 4) {
  const p = seg(t, t0, t0 + dur); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = rgba(c, (1 - p) * .8); ctx.lineWidth = w * (1 - p) + .5;
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, E.out3(p)), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function burst(x, y, t, t0, n, seed, cols, spd = 420, life = 1.3) {
  const p = (t - t0) / life; if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = hash(seed + i) * Math.PI * 2, v = spd * (.35 + hash(seed + i * 7.3) * .9);
    const d = v * E.out3(p) * life * .8, px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + 120 * p * p;
    const c = cols[i % cols.length];
    ctx.fillStyle = rgba(c, (1 - p) * .9); ctx.beginPath(); ctx.arc(px, py, (2 + hash(seed + i * 3.1) * 5) * (1 - p * .6), 0, 7); ctx.fill();
  }
  ctx.restore();
}
function flash(alpha, c = [255, 240, 210]) { if (alpha <= 0) return; ctx.fillStyle = rgba(c, alpha); ctx.fillRect(0, 0, W, H); }
// 以世界坐标 (fx,fy) 为焦点推近：焦点同时被拉到屏幕中央
function zoomTo(fx, fy, s, centerP) {
  ctx.translate(lerp(fx, W / 2, centerP), lerp(fy, H / 2, centerP)); ctx.scale(s, s); ctx.translate(-fx, -fy);
}
// 横屏舞台：各场景按设计坐标绘制，再整体缩放摆进 1920×1080
const FIT_P = { s: .62, ax: 540, ay: 840, bx: 960, by: 455 };  // 手机
const FIT_A = { s: .75, ax: 540, ay: 820, bx: 960, by: 480 };  // 柱子
const FIT_B = { s: .75, ax: 540, ay: 850, bx: 960, by: 470 };  // 模拟 / 另一半 / 时间轴 / 片尾
const fitPt = (f, x, y) => [f.bx + (x - f.ax) * f.s, f.by + (y - f.ay) * f.s];
function applyFit(f) { ctx.translate(f.bx, f.by); ctx.scale(f.s, f.s); ctx.translate(-f.ax, -f.ay); }
// 先在屏幕空间以设计点为焦点推近，再套舞台变换
function zoomFit(f, x, y, s, centerP) { const [sx, sy] = fitPt(f, x, y); zoomTo(sx, sy, s, centerP); applyFit(f); }

// ---------- 预渲染：背景、暗角、颗粒 ----------
const vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
{ const g = vignette.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.72)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const grains = [];
for (let k = 0; k < 4; k++) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .37 + k * 91.7) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 20; }
  g.putImageData(im, 0, 0); grains.push(ctx.createPattern(c, 'repeat'));
}
const STARS = Array.from({ length: 110 }, (_, i) => ({ x: hash(i) * W, y: hash(i + 500) * H, r: .6 + hash(i + 900) * 1.8, s: .2 + hash(i + 1300) }));

// 每一段的背景色调
const TINTS = [
  [0, [255, 93, 122], [120, 80, 200]], [16.5, [255, 93, 122], [120, 80, 200]],
  [17.2, [60, 110, 220], [255, 207, 110]], [47, [60, 110, 220], [255, 207, 110]],
  [48.5, [40, 90, 200], [120, 200, 255]], [77, [40, 90, 200], [120, 200, 255]],
  [79, [40, 50, 90], [90, 70, 120]], [93, [40, 50, 90], [90, 70, 120]],
  [94, [255, 170, 80], [60, 110, 220]], [111, [255, 170, 80], [60, 110, 220]],
  [112.5, [255, 93, 122], [255, 207, 110]], [130, [255, 207, 110], [255, 93, 122]],
];
function tintAt(t) {
  for (let i = 0; i < TINTS.length - 1; i++) if (t < TINTS[i + 1][0]) {
    const p = E.io3(seg(t, TINTS[i][0], TINTS[i + 1][0]));
    return [mix(TINTS[i][1], TINTS[i + 1][1], p), mix(TINTS[i][2], TINTS[i + 1][2], p)];
  }
  return [TINTS[TINTS.length - 1][1], TINTS[TINTS.length - 1][2]];
}
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0c14'); g.addColorStop(1, '#05060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [c1, c2] = tintAt(t), e = env(t), k = kick(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const blobs = [[c1, .25, .3, 700, 0], [c2, .78, .72, 760, 2.1], [c1, .6, .15, 520, 4.2]];
  for (const [c, bx, by, br, ph] of blobs) {
    const x = W * bx + Math.sin(t * .13 + ph) * 120, y = H * by + Math.cos(t * .11 + ph) * 160;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, br * (1 + k * .06));
    gr.addColorStop(0, rgba(c, .085 + e * .05 + k * .03)); gr.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  for (const s of STARS) {
    const y = (s.y - t * 8 * s.s + H * 10) % H;
    ctx.fillStyle = `rgba(255,240,220,${(.12 + .25 * s.s) * (.7 + .3 * Math.sin(t * 2 + s.x))})`;
    ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawPost(t) {
  ctx.drawImage(vignette, 0, 0);
  ctx.save(); const f = Math.floor(t * 24); ctx.translate((hash(f) * 256) | 0, (hash(f + 3) * 256) | 0);
  ctx.fillStyle = grains[f % 4]; ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
}

// ============================================================
//  字幕（逐字浮现，关键词高亮：{金色} [玫红]）
// ============================================================
const CAPS = [
  [0.35, 3.75, '如果你这辈子，会认真遇见 {10} 个人'],
  [3.85, 7.65, '每个人，你都只能当场决定\n在一起，还是错过'],
  [7.75, 11.5, '错过的人，[不会回头]'],
  [11.6, 15.3, '那你应该在{第几个人}\n停下来？'],
  [17.4, 20.8, '两种最常见的失败'],
  [21.0, 24.3, '太着急：遇到第 {2} 个就定了'],
  [24.4, 26.7, '后面明明还有[更好的]'],
  [27.0, 29.9, '太挑剔：总觉得[下一个]更好'],
  [30.0, 32.5, '最好的那个，早就[错过]了'],
  [33.1, 36.5, '数学家给出的答案\n只有{两步}'],
  [36.6, 41.2, '① 前 {37%}：只看，不选'],
  [41.3, 45.2, '② 之后，遇到第一个比他们都好的\n{立刻停下}'],
  [45.3, 47.3, '[就是 TA]'],
  [48.1, 51.6, '为什么偏偏是这个数？'],
  [51.8, 57.8, '让电脑把这场「相亲」\n模拟 {10 万} 次'],
  [58.0, 61.9, '试遍每一种「停下的时机」'],
  [62.0, 65.9, '看哪种，最可能遇到{最好的人}'],
  [66.0, 71.9, '曲线的最高点，正好在 {37%}'],
  [72.0, 74.8, '而成功率，也恰好是 {37%}'],
  [74.9, 77.6, '{1/e}：自然常数 e\n藏在了你的爱情里'],
  [78.6, 82.6, '但别忘了，还有另一半'],
  [82.7, 88.0, '就算用上最优策略\n仍有 [63%] 的人，等不到最好的那个'],
  [88.1, 93.2, '数学能给你{最好的策略}\n却不保证最好的结局'],
  [93.7, 96.8, '这个法则，藏在生活的每个角落'],
  [96.9, 100.4, '租房：看 30 天，前 {11} 天只看不租'],
  [100.5, 104.0, '招人：面 20 个，前 {7} 个只面不招'],
  [104.1, 108.2, '如果你打算在 {18～35} 岁之间\n找到那个人'],
  [108.3, 111.9, '你的「只看不选」期\n在 {24 岁} 结束'],
  [112.4, 116.5, '所以——\n你现在，走到{第几个人}了？'],
  [116.6, 121.6, '如果下一个人，比之前所有人都好\n[你会停下吗？]'],
].map(([a, b, s]) => ({ a, b, lines: parseCap(s) }));
function parseCap(s) {
  const lines = [[]]; let hl = 0;
  for (const ch of s) {
    if (ch === '{') { hl = 1; continue; } if (ch === '}' || ch === ']') { hl = 0; continue; }
    if (ch === '[') { hl = 2; continue; } if (ch === '\n') { lines.push([]); continue; }
    lines[lines.length - 1].push({ ch, hl });
  }
  return lines;
}
const CAP_Y = 975, CAP_FS = 54, CAP_MAXW = 1500;
function drawCaptions(t) {
  for (const c of CAPS) {
    if (t < c.a || t > c.b) continue;
    const vis = win(t, c.a, c.b, .3, .25);
    ctx.save();
    // 字幕底部的柔和暗场，保证可读
    const gr = ctx.createRadialGradient(W / 2, CAP_Y + 30, 0, W / 2, CAP_Y + 30, 620);
    gr.addColorStop(0, `rgba(5,6,10,${.6 * vis})`); gr.addColorStop(1, 'rgba(5,6,10,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, CAP_Y - 300, W, 420);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = `700 ${CAP_FS}px ${SANS}`;
    let maxw = 0; for (const ln of c.lines) maxw = Math.max(maxw, ln.reduce((s, o) => s + ctx.measureText(o.ch).width, 0));
    const fs = Math.min(CAP_FS, CAP_FS * CAP_MAXW / maxw), lh = fs * 1.5;
    ctx.font = `700 ${fs}px ${SANS}`;
    const y0 = CAP_Y - (c.lines.length - 1) * lh / 2;
    const exit = seg(t, c.b - .25, c.b), k = kick(t);
    let idx = 0;
    c.lines.forEach((ln, li) => {
      const ws = ln.map(o => ctx.measureText(o.ch).width), tw = ws.reduce((a, b) => a + b, 0);
      let x = W / 2 - tw / 2;
      ln.forEach((o, i) => {
        const tc = c.a + idx * .028, p = E.out3(seg(t, tc, tc + .4)); idx++;
        const a = p * (1 - exit); if (a > 0) {
          const y = y0 + li * lh + (1 - p) * 28 - exit * 16;
          ctx.globalAlpha = a;
          if (o.hl) {
            const cc = o.hl === 1 ? COL.gold : COL.rose;
            ctx.shadowColor = rgba(cc, .9); ctx.shadowBlur = 18 + 22 * k; ctx.fillStyle = rgba(cc);
          } else { ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12; ctx.fillStyle = rgba(COL.text); }
          ctx.fillText(o.ch, x, y);
        }
        x += ws[i];
      });
    });
    ctx.restore();
  }
}

// 顶部章节标签
const LABELS = [
  [17.2, 32.8, '01', '直觉的陷阱'], [33.0, 47.4, '02', '37% 法则'], [47.9, 77.6, '03', '为什么是 37%'],
  [78.4, 93.2, '04', '另一半'], [93.7, 111.6, '05', '生活里的 37%'],
];
function drawChrome(t) {
  const a = win(t, .6, 121.8, .8, .6);
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a;
    glowText('Vibe 知识大赏', 70, 50, `700 30px ${SANS}`, rgba(COL.dim, .9), 0, 'left');
    glowText('何时该停下', W - 70, 50, `700 30px ${SERIF}`, rgba(COL.gold, .85), 0, 'right');
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(70, 80, W - 140, 3);
    ctx.fillStyle = rgba(COL.gold, .8); ctx.fillRect(70, 80, (W - 140) * clamp(t / 122), 3);
    ctx.restore();
  }
  for (const [s, e, num, title] of LABELS) {
    const v = win(t, s, e, .5, .4); if (v <= 0) continue;
    ctx.save(); ctx.globalAlpha = v; const dx = (1 - E.out3(seg(t, s, s + .6))) * -40;
    glowText(num, 70 + dx, 130, `900 40px ${SANS}`, rgba(COL.gold), 16, 'left');
    ctx.fillStyle = rgba(COL.gold, .6); ctx.fillRect(130 + dx, 128, 60 * E.out3(seg(t, s + .1, s + .7)), 2);
    glowText(title, 208 + dx, 130, `700 36px ${SANS}`, rgba(COL.text, .9), 0, 'left');
    ctx.restore();
  }
}

// ============================================================
//  场景 1 / 7：手机
// ============================================================
const PH = { x: 540, y: 840, w: 560, h: 1080 };
const PERSONS = [
  { no: 'No.1', age: 26, tags: ['摄影', '猫派', 'ENFP'], c1: [255, 120, 160], c2: [120, 70, 200] },
  { no: 'No.2', age: 25, tags: ['健身', '早起', 'INTJ'], c1: [60, 200, 190], c2: [30, 80, 160] },
  { no: 'No.3', age: 27, tags: ['读书', '咖啡', 'ISFJ'], c1: [255, 180, 90], c2: [200, 70, 90] },
  { no: 'No.4', age: 24, tags: ['旅行', '吉他', 'ENTP'], c1: [120, 140, 255], c2: [200, 80, 200] },
  { no: 'No.?', age: '?', tags: ['比之前所有人都好'], c1: [255, 207, 110], c2: [255, 93, 122], special: true },
];
const CARD = { w: 470, h: 630, cy: 840 };
const BADGE = { x: PH.x + CARD.w / 2 - 62, y: CARD.cy + CARD.h / 2 - 66, r: 36 };

function drawCard(p, t, opts) {
  const { x, y, s, rot, alpha, stamp, revealMeter } = opts;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const w = CARD.w, h = CARD.h, L = -w / 2, T = -h / 2;
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rr(L, T, w, h, 34); ctx.fillStyle = '#1a1d2b'; ctx.fill();

  // 刻度（每段淡入淡出）
  for (const c of AXCFG) {
    const a = win(t, c[0], c[1], .35, .3) * ap; if (a <= 0) continue;
    if (c[2] > 0) for (let i = 0; i < c[2]; i++) {
      const f = c[2] === 18 ? i / 17 : (i + .5) / c[2], x = lerp(AX.x0, AX.x1, f), tp = E.out3(seg(t, c[0] + i * .015, c[0] + .3 + i * .015));
      const inObs = f < mpos;
      ctx.fillStyle = inObs ? rgba(COL.ice, a) : `rgba(255,255,255,${.55 * a})`;
      ctx.fillRect(x - 2, AX.y - 18 * tp, 4, 36 * tp);
      if (c[2] === 18 && (i % 1 === 0)) glowText(String(18 + i), x, AX.y + 50, `700 32px ${SANS}`, inObs ? rgba(COL.ice, .9) : 'rgba(255,255,255,.5)', 0, 'center', a);
    }
    if (c[2] !== 18) {
      glowText(c[3], AX.x0, AX.y + 58, `700 36px ${SANS}`, 'rgba(255,255,255,.65)', 0, 'left', a);
      glowText(c[4], AX.x1, AX.y + 58, `700 36px ${SANS}`, 'rgba(255,255,255,.65)', 0, 'right', a);
    }
    glowText('只看', lerp(AX.x0, mx, .5), AX.y + (c[2] === 18 ? 104 : 58), `700 36px ${SANS}`, rgba(COL.ice), 0, 'center', a * (c[2] === 18 ? seg(t, 109.2, 109.6) : 1));
  }
  // 标记
  ctx.save(); ctx.globalAlpha = ap;
  ctx.strokeStyle = rgba(COL.gold); ctx.lineWidth = 4; ctx.shadowColor = rgba(COL.gold); ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(mx, AX.y + 24); ctx.lineTo(mx, knobY); ctx.stroke();
  ctx.beginPath(); ctx.arc(mx, knobY, 16 + 5 * kick(t), 0, 7); ctx.fillStyle = rgba(COL.gold); ctx.fill(); ctx.restore();
  for (const c of AXCFG) {
    const a = win(t, c[0] + .2, c[1], .35, .3) * ap * (c[2] === 18 ? seg(t, 109.0, 109.5) : 1);
    if (c[2] === 18) {
      glowText(c[6], mx, knobY - 170, `900 120px ${SERIF}`, rgba(COL.gold), 40 + 30 * kick(t), 'center', a);
    } else glowText(c[6], mx, knobY - 54, `900 46px ${SANS}`, rgba(COL.gold), 16, 'center', a);
  }
  // 图标
  const row = win(t, 93.9, 96.85, .3, .3);
  ['house', 'bag', 'heart'].forEach((k, i) => {
    const tt = 94.2 + i * .55, p = E.outBack(seg(t, tt, tt + .5));
    icon(k, 240 + i * 300, 700, 1.25 * clamp(p, 0, 1.2), seg(t, tt, tt + .8), row);
  });
  icon('house', 540, 690, 2.1, seg(t, 97.0, 97.9), win(t, 96.9, 100.45, .3, .3));
  icon('bag', 540, 690, 2.1, seg(t, 100.6, 101.5), win(t, 100.5, 104.05, .3, .3));
  icon('heart', 540, 640, 2.1, seg(t, 104.2, 105.2), win(t, 104.1, 108.3, .3, .4));
  ring(mx, knobY, t, 109.4, 1.2, 10, 360, COL.gold, 6);
  ctx.restore();
  flash((1 - seg(t, 93.5, 93.9)) * .5);
  ring(W / 2, fitPt(FIT_B, 540, AX.y)[1], t, 93.5, 1.2, 40, 1300, COL.gold, 8);
}

// ============================================================
//  场景 8：片尾
// ============================================================
function sceneOutro(t) {
  const a = seg(t, 122.0, 122.8);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 80; i++) {
    const x = hash(i * 1.3) * W + Math.sin(t * .4 + i) * 40, y = (hash(i * 2.7) * H - t * (20 + hash(i) * 40)) % H;
    ctx.fillStyle = rgba(i % 4 ? COL.gold : COL.rose, (.1 + hash(i * 9) * .4) * a);
    ctx.beginPath(); ctx.arc(x, (y + H) % H, 1 + hash(i * 5) * 3, 0, 7); ctx.fill();
  }
  ctx.restore();
  const title = '何时该停下';
  ctx.save(); applyFit(FIT_B);
  ctx.save(); ctx.font = `900 150px ${SERIF}`; ctx.textBaseline = 'middle';
  const ws = [...title].map(ch => ctx.measureText(ch).width + 20), tw = ws.reduce((x, y) => x + y, 0) - 20;
  let x = 540 - tw / 2;
  [...title].forEach((ch, i) => {
    const p = E.out3(seg(t, 122.3 + i * .12, 123.0 + i * .12));
    ctx.globalAlpha = p; ctx.fillStyle = rgba(COL.gold); ctx.shadowColor = rgba(COL.gold); ctx.shadowBlur = 40 + 30 * kick(t);
    ctx.fillText(ch, x, 820 + (1 - p) * 40); x += ws[i];
  });
  ctx.restore();
  const lp = E.io3(seg(t, 123.2, 124.0));
  ctx.fillStyle = rgba(COL.gold, .6); ctx.fillRect(540 - 260 * lp, 940, 520 * lp, 2);
  glowText('最优停止理论 · 37% 法则', 540, 1010, `700 52px ${SANS}`, rgba(COL.text), 0, 'center', seg(t, 123.5, 124.2));
  glowText('先看 37%，再遇到更好的，就停下', 540, 1090, `400 40px ${SANS}`, rgba(COL.dim), 0, 'center', seg(t, 124.0, 124.7));
  glowText('The Secretary Problem  ·  1/e ≈ 0.3679', 540, 1160, `400 32px ${SANS}`, rgba(COL.dim, .7), 0, 'center', seg(t, 124.4, 125.1));
  glowText('Vibe 知识大赏', 540, 1290, `900 48px ${SANS}`, rgba(COL.gold, .9), 10, 'center', seg(t, 124.8, 125.5));
  glowText('你会在第几个人停下？评论区见', 540, 1350, `400 36px ${SANS}`, rgba(COL.dim), 0, 'center', seg(t, 125.2, 125.9));
  ctx.restore();
}

// ============================================================
//  主渲染
// ============================================================
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground(t);
  if (t < 17.0) scenePhoneIntro(t);
  else if (t < 47.75) scenePillars(t);
  else if (t < 78.4) { sceneSim(t); if (t > 77.6) sceneOtherHalf(t); }
  else if (t < 93.5) sceneOtherHalf(t);
  else if (t < 112.0) { sceneLife(t); if (t < 94.3) sceneOtherHalf(t); }
  else { if (t < 122.7) scenePhoneOutro(t); if (t > 122) sceneOutro(t); }
  drawPost(t);
  drawCaptions(t);
  drawChrome(t);
  flash(seg(t, 128.6, 130), [0, 0, 0]);
}

// ============================================================
//  播放控制
// ============================================================
const bgm = document.getElementById('bgm'), panel = document.getElementById('panel');
const playBtn = document.getElementById('play'), expBtn = document.getElementById('export'), statusEl = document.getElementById('status');
const qs = new URLSearchParams(location.search);
let manualT = parseFloat(qs.get('t') || '0'), exporting = false;
function loop() {
  if (!exporting) {
    let t = bgm.paused ? manualT : bgm.currentTime;
    if (!bgm.paused && t >= DUR) { bgm.pause(); manualT = DUR; panel.classList.remove('hide'); }
    if (!bgm.paused) bgm.volume = 1 - seg(t, 128, 130) * .9;
    render(Math.min(t, DUR));
  }
  requestAnimationFrame(loop);
}
function play(from) { bgm.currentTime = from ?? manualT; bgm.play(); panel.classList.add('hide'); }
playBtn.onclick = () => { if (manualT >= DUR - .5) manualT = 0; play(); };
document.addEventListener('keydown', e => {
  if (exporting) return;
  if (e.code === 'Space') { e.preventDefault(); if (bgm.paused) play(); else { bgm.pause(); manualT = bgm.currentTime; } }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    const d = e.code === 'ArrowRight' ? 5 : -5;
    if (bgm.paused) manualT = clamp(manualT + d, 0, DUR); else bgm.currentTime = clamp(bgm.currentTime + d, 0, DUR);
  }
  else if (e.code === 'KeyF') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.code === 'Escape') { bgm.pause(); manualT = bgm.currentTime; panel.classList.remove('hide'); }
});

// ============================================================
//  导出 MP4（WebCodecs + mp4-muxer，逐帧离线渲染，不掉帧）
// ============================================================
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportMP4(fps = 60, dur = DUR) {
  if (!('VideoEncoder' in window)) { statusEl.textContent = '当前浏览器不支持 WebCodecs，请用最新版 Chrome / Edge'; return; }
  if (!window.Mp4Muxer) {
    statusEl.textContent = '加载封装库…';
    try { await loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js'); }
    catch { await loadScript('https://unpkg.com/mp4-muxer@5.1.3/build/mp4-muxer.min.js'); }
  }
  exporting = true; bgm.pause(); playBtn.disabled = expBtn.disabled = true;
  const sr = AB.sampleRate, ch = Math.min(2, AB.numberOfChannels);
  let vcfg = { codec: 'avc1.640034', width: W, height: H, bitrate: fps > 60 ? 28e6 : 16e6, framerate: fps };
  if (!(await VideoEncoder.isConfigSupported(vcfg)).supported) vcfg = { ...vcfg, codec: 'avc1.4d0034' };
  let acodec = 'aac', acfg = { codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 };
  if (!(await AudioEncoder.isConfigSupported(acfg)).supported) { acodec = 'opus'; acfg = { codec: 'opus', sampleRate: sr, numberOfChannels: ch, bitrate: 192000 }; }
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', firstTimestampBehavior: 'offset',
    video: { codec: 'avc', width: W, height: H, frameRate: fps }, audio: { codec: acodec, numberOfChannels: ch, sampleRate: sr } });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { statusEl.textContent = '视频编码出错：' + e.message; } });
  ve.configure(vcfg);
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { statusEl.textContent = '音频编码出错：' + e.message; } });
  ae.configure(acfg);
  const totalS = Math.floor(dur * sr), CHUNK = 4096, chans = [...Array(ch)].map((_, c) => AB.getChannelData(c));
  let aOff = 0;
  const pushAudioUntil = sec => {
    const until = Math.min(totalS, Math.floor(sec * sr));
    while (aOff < until) {
      const n = Math.min(CHUNK, totalS - aOff), data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) for (let i = 0; i < n; i++) { const tt = (aOff + i) / sr; data[c * n + i] = chans[c][aOff + i] * (1 - seg(tt, 128, 130) * .95); }
      ae.encode(new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(aOff / sr * 1e6), data }));
      aOff += n;
    }
  };
  const frames = Math.round(dur * fps), t0 = performance.now();
  for (let i = 0; i < frames; i++) {
    const t = i / fps; render(t); pushAudioUntil(t + 1);
    const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
    ve.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
    if (ve.encodeQueueSize > 6) await new Promise(r => ve.addEventListener('dequeue', r, { once: true }));
    if (i % 20 === 0) {
      const el = (performance.now() - t0) / 1000, eta = el / (i + 1) * (frames - i - 1);
      statusEl.textContent = `导出中 ${(i / frames * 100).toFixed(1)}%  ·  剩余约 ${Math.ceil(eta)} 秒（请保持此标签页在前台）`;
      await new Promise(r => setTimeout(r, 0));
    }
  }
  pushAudioUntil(dur + 1);
  await ve.flush(); await ae.flush(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `何时该停下_1920x1080_${fps}fps.mp4`; a.click();
  statusEl.textContent = `导出完成：${(blob.size / 1048576).toFixed(1)} MB（音频 ${acodec.toUpperCase()}）`;
  exporting = false; playBtn.disabled = expBtn.disabled = false;
}
const exportClick = () => exportMP4(parseInt(qs.get('fps') || '120'), parseFloat(qs.get('dur') || DUR)).catch(e => { statusEl.textContent = '导出失败：' + e.message; exporting = false; playBtn.disabled = expBtn.disabled = false; });

// ============================================================
//  启动：等字体 + 解码音频
// ============================================================
(async () => {
  const allText = CAPS.map(c => c.lines.flat().map(o => o.ch).join('')).join('') + LABELS.map(l => l[3]).join('') +
    '何时该停下今日推荐第位心动值错过岁摄影猫派健身早起读书咖啡旅行吉他比之前所有人都好观察期只看不选行动期标杆你就你了更好最好的只剩了全场最佳已模拟次选中概率占比开始结束天18～350123456789.%?/e≈…最优停止理论法则先看再遇到就停下评论区见没有遇到 VibeTheSecretaryProblem';
  statusEl.textContent = '加载字体与音乐…';
  const fontLoads = [`900 40px "Noto Sans SC"`, `700 40px "Noto Sans SC"`, `400 40px "Noto Sans SC"`, `900 40px "Noto Serif SC"`].map(f => document.fonts.load(f, allText));
  await Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 6000))]);
  const useAudio = async buf => {
    AB = await new AudioContext({ sampleRate: 48000 }).decodeAudioData(buf);
    buildEnvelope(AB);
    expBtn.disabled = false; expBtn.textContent = '导出 MP4（1920×1080 · 120fps）'; expBtn.onclick = exportClick;
  };
  try {
    await useAudio(await (await fetch('bgm.mp4')).arrayBuffer());
  } catch (e) {
    // 双击 file:// 打开时浏览器禁止读取本地文件，改为让用户手动选一次 bgm.mp4
    const pick = document.createElement('input'); pick.type = 'file'; pick.accept = 'audio/*,video/mp4';
    pick.onchange = async () => {
      const f = pick.files[0]; if (!f) return;
      statusEl.textContent = '解析音频…';
      try { await useAudio(await f.arrayBuffer()); statusEl.textContent = '音频已就绪，可以导出了'; }
      catch (err) { statusEl.textContent = '音频解析失败：' + err.message; }
    };
    expBtn.disabled = false; expBtn.textContent = '选择 bgm.mp4 以启用导出'; expBtn.onclick = () => pick.click();
    statusEl.textContent = '你是双击打开的，浏览器不允许自动读取音乐。点上面按钮，选一下同目录的 bgm.mp4 即可';
  }
  playBtn.disabled = false; playBtn.textContent = '▶  播放';
  if (statusEl.textContent.startsWith('加载')) statusEl.textContent = '';
  if (qs.has('hide')) panel.classList.add('hide');
  loop();
})();
</script>
